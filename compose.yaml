# =============================================================================
# compose.yaml — Docker Compose Configuration
# =============================================================================
# Docker Compose lets you define and run your application with a single command.
# Instead of typing a long "docker run" command with all the options,
# you define everything in this file and run: docker compose up
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Logs:    docker compose logs -f
# Rebuild: docker compose up -d --build
# =============================================================================

services:
  # Our web service
  web:
    # Build the image from the Dockerfile in the current directory
    build:
      context: .
      dockerfile: Dockerfile

    # Name the container for easy reference
    container_name: docker-web-service

    # Map host port 3000 to container port 3000
    # Format: "HOST_PORT:CONTAINER_PORT"
    ports:
      - "3000:3000"

    # Set environment variables
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_VERSION=1.0.0

    # Restart the container automatically if it crashes
    # "unless-stopped" means restart always, except when manually stopped
    restart: unless-stopped

    # Use the health check defined in the Dockerfile
    # You can override it here if needed
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
